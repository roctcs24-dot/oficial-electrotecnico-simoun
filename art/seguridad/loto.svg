<svg xmlns="http://www.w3.org/2000/svg" width="420" height="360" viewBox="0 0 420 360">
  <defs>
    <linearGradient id="caja" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a6065"/>
      <stop offset="1" stop-color="#34383c"/>
    </linearGradient>
    <linearGradient id="maneta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a2c2f"/>
      <stop offset="0.5" stop-color="#55595d"/>
      <stop offset="1" stop-color="#1f2123"/>
    </linearGradient>
    <linearGradient id="candado" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2574a"/>
      <stop offset="1" stop-color="#9c231a"/>
    </linearGradient>
    <linearGradient id="arco" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7f8588"/>
      <stop offset="0.4" stop-color="#e3e6e7"/>
      <stop offset="1" stop-color="#6d7376"/>
    </linearGradient>
  </defs>

  <!-- Cuerpo del aislador -->
  <rect x="14" y="20" width="200" height="320" rx="10" fill="url(#caja)"/>
  <rect x="14.75" y="20.75" width="198.5" height="318.5" rx="9.5" fill="none" stroke="#8a9094" stroke-opacity="0.6" stroke-width="1.5"/>
  <rect x="86" y="42" width="48" height="36" rx="4" fill="#1b1d20"/>

  <!-- Maneta en posición abierta -->
  <circle cx="114" cy="186" r="66" fill="#23262a"/>
  <circle cx="114" cy="186" r="60" fill="#3a3e42"/>
  <path d="M56,118 L90,160" stroke="#34a35a" stroke-width="7" stroke-linecap="round"/>
  <g transform="rotate(-40 114 186)">
    <rect x="96" y="108" width="36" height="150" rx="16" fill="url(#maneta)"/>
    <rect x="108" y="116" width="12" height="44" rx="4" fill="#d5d9db"/>
  </g>

  <!-- Candado -->
  <path d="M100,250 V226 a26,26 0 0 1 52,0 V250" fill="none" stroke="url(#arco)" stroke-width="10"/>
  <rect x="86" y="248" width="80" height="72" rx="8" fill="url(#candado)"/>
  <circle cx="126" cy="278" r="9" fill="#1c1d1f"/>
  <rect x="122" y="280" width="8" height="20" rx="3" fill="#1c1d1f"/>

  <!-- Cordón de la tarjeta -->
  <path d="M166,272 C200,276 216,200 250,146" fill="none" stroke="#20242a" stroke-width="3"/>

  <!-- Tarjeta -->
  <path d="M260,126 H404 V338 H230 V156 Z" fill="#000000" fill-opacity="0.18" transform="translate(5 5)"/>
  <path d="M260,126 H404 V338 H230 V156 Z" fill="#fdfdf5"/>
  <path d="M260,126 H404 V178 H230 V156 Z" fill="#c9231b"/>
  <circle cx="250" cy="146" r="7" fill="#eceee8" stroke="#20242a" stroke-width="2"/>
  <path d="M302,250 H394 M294,278 H394" stroke="#20242a" stroke-width="1.5"/>
  <path d="M240,310 H394" stroke="#c9231b" stroke-width="5"/>
</svg>
