<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="360" height="440" viewBox="0 0 360 440">
  <defs>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34383c"/><stop offset="0.07" stop-color="#4d5257"/><stop offset="0.5" stop-color="#565b60"/><stop offset="0.93" stop-color="#4a4f54"/><stop offset="1" stop-color="#2f3337"/>
    </linearGradient>
    <linearGradient id="cobre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d4f25"/><stop offset="0.4" stop-color="#e8a77a"/><stop offset="1" stop-color="#7a4320"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c5156"/><stop offset="1" stop-color="#34383c"/>
    </linearGradient>
    <linearGradient id="banda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e8e8"/><stop offset="1" stop-color="#c3c7c9"/>
    </linearGradient>
    <linearGradient id="azul" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f7fc4"/><stop offset="1" stop-color="#1e4f8c"/>
    </linearGradient>
    <linearGradient id="rojo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2574a"/><stop offset="1" stop-color="#a0231a"/>
    </linearGradient>
    <radialGradient id="acero" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#f4f6f6"/><stop offset="0.55" stop-color="#b3b8ba"/><stop offset="1" stop-color="#5f6568"/>
    </radialGradient>
    <radialGradient id="hueco" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0.55" stop-color="#050506"/><stop offset="1" stop-color="#26282b"/>
    </radialGradient>
    <g id="tornillo">
      <circle r="10" fill="#0a0a0b"/><circle r="9.2" fill="url(#acero)"/>
      <path d="M-5.2,0 H5.2 M0,-5.2 V5.2" stroke="#33373a" stroke-width="2.4" stroke-linecap="round"/>
    </g>
    <g id="bornePotencia">
      <circle r="27" fill="#2b2e31"/><circle r="25" fill="url(#hueco)"/>
      <rect x="-14" y="-14" width="28" height="28" rx="3" fill="#6f7578"/>
      <use xlink:href="#tornillo" transform="scale(1.25)"/>
    </g>
    <g id="borneMando">
      <circle r="17" fill="#2b2e31"/><circle r="15.4" fill="url(#hueco)"/>
      <use xlink:href="#tornillo"/>
    </g>
  </defs>

  <!-- Pernos de cobre que entran en los bornes del contactor -->
  <rect x="100" y="0" width="16" height="74" rx="2" fill="url(#cobre)"/>
  <rect x="172" y="0" width="16" height="74" rx="2" fill="url(#cobre)"/>
  <rect x="244" y="0" width="16" height="74" rx="2" fill="url(#cobre)"/>

  <!-- Sombra y cuerpo -->
  <rect x="64" y="60" width="244" height="376" rx="10" fill="#000000" fill-opacity="0.32"/>
  <path d="M66,56 H294 Q300,56 300,62 V344 L290,424 Q289,430 283,430 H77 Q71,430 70,424 L60,344 V62 Q60,56 66,56 Z" fill="url(#cuerpo)"/>
  <path d="M60,344 H300 L290,424 Q289,430 283,430 H77 Q71,430 70,424 Z" fill="#3e4347"/>
  <rect x="60" y="342" width="240" height="3" fill="#191b1d"/>

  <!-- Panel frontal -->
  <rect x="68" y="66" width="224" height="186" rx="6" fill="url(#panel)"/>
  <rect x="68.75" y="66.75" width="222.5" height="184.5" rx="5.5" fill="none" stroke="#7b8187" stroke-opacity="0.7" stroke-width="1.5"/>
  <rect x="76" y="74" width="208" height="26" rx="3" fill="url(#banda)"/>

  <!-- Dial de ajuste -->
  <circle cx="132" cy="176" r="41" fill="#1f2225"/>
  <circle cx="132" cy="176" r="31" fill="#d6d9da"/>
  <circle cx="132" cy="176" r="31" fill="none" stroke="#7d8285" stroke-width="1.5"/>
  <rect x="128" y="146" width="8" height="30" rx="2" fill="#2a2d30" transform="rotate(32 132 176)"/>
  <circle cx="132" cy="176" r="6" fill="#2a2d30"/>

  <!-- Selector manual o automático -->
  <rect x="192" y="122" width="24" height="50" rx="3" fill="#1b1d20"/>
  <rect x="196" y="126" width="16" height="20" rx="2" fill="#8d9396"/>

  <!-- Testigo de disparo y botones -->
  <rect x="192" y="190" width="36" height="46" rx="2" fill="#1b1d20"/>
  <rect x="196" y="194" width="28" height="38" rx="1" fill="#6f7578"/>
  <rect x="240" y="124" width="40" height="40" rx="4" fill="#0e1012"/>
  <rect x="244" y="128" width="32" height="32" rx="3" fill="url(#azul)"/>
  <rect x="240" y="196" width="40" height="40" rx="4" fill="#0e1012"/>
  <rect x="244" y="200" width="32" height="32" rx="3" fill="url(#rojo)"/>

  <!-- Bornes del contacto auxiliar -->
  <use xlink:href="#borneMando" x="96" y="282"/>
  <use xlink:href="#borneMando" x="152" y="282"/>
  <use xlink:href="#borneMando" x="208" y="282"/>
  <use xlink:href="#borneMando" x="264" y="282"/>

  <!-- Bornes de salida al motor -->
  <use xlink:href="#bornePotencia" x="110" y="380"/>
  <use xlink:href="#bornePotencia" x="180" y="380"/>
  <use xlink:href="#bornePotencia" x="250" y="380"/>
  <g fill="#23262a">
    <rect x="142" y="348" width="6" height="76" rx="3"/>
    <rect x="212" y="348" width="6" height="76" rx="3"/>
  </g>
</svg>
