    </linearGradient>
    <linearGradient id="alternador" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a7186"/><stop offset="0.5" stop-color="#3e5366"/><stop offset="1" stop-color="#26343f"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
