      <stop offset="0" stop-color="#f4f6f6"/><stop offset="0.55" stop-color="#b3b8ba"/><stop offset="1" stop-color="#5f6568"/>
    </radialGradient>
  </defs>
  <!-- Bancada con antivibratorios -->
  <rect x="20" y="288" width="420" height="20" rx="3" fill="url(#bancada)"/>
