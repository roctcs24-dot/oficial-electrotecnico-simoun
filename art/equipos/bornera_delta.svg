<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="400" viewBox="0 0 480 400">
  <defs>
    <linearGradient id="caja" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f5f79"/><stop offset="1" stop-color="#22394b"/>
    </linearGradient>
    <linearGradient id="placa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4d50"/><stop offset="1" stop-color="#2f3235"/>
    </linearGradient>
    <linearGradient id="cobre" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8a77a"/><stop offset="0.5" stop-color="#c47b49"/><stop offset="1" stop-color="#8d4f25"/>
    </linearGradient>
    <radialGradient id="bronce" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#fbe6a2"/><stop offset="0.5" stop-color="#c9973f"/><stop offset="1" stop-color="#6f4e1a"/>
    </radialGradient>
    <g id="espiga">
      <path d="M-17,-10 L0,-20 L17,-10 V10 L0,20 L-17,10 Z" fill="url(#bronce)" stroke="#4a3210" stroke-width="1.5"/>
      <circle r="8" fill="#e8c878" stroke="#6f4e1a" stroke-width="1.5"/>
    </g>
  </defs>

  <!-- Caja de bornes abierta -->
  <rect x="10" y="10" width="460" height="340" rx="10" fill="url(#caja)"/>
  <rect x="48" y="48" width="384" height="264" rx="6" fill="url(#placa)"/>
  <rect x="48.75" y="48.75" width="382.5" height="262.5" rx="5.5" fill="none" stroke="#6d7376" stroke-width="1.5"/>

  <!-- Cables de alimentación -->
  <path d="M130,240 V400" stroke="#6b3f20" stroke-width="16"/>
  <path d="M240,240 V400" stroke="#17181a" stroke-width="16"/>
  <path d="M350,240 V400" stroke="#85898c" stroke-width="16"/>

  <!-- Puentes: U1-W2, V1-U2, W1-V2 -->
  <rect x="118" y="92" width="24" height="166" rx="5" fill="url(#cobre)" stroke="#6b3a18" stroke-width="1.5"/>
  <rect x="228" y="92" width="24" height="166" rx="5" fill="url(#cobre)" stroke="#6b3a18" stroke-width="1.5"/>
  <rect x="338" y="92" width="24" height="166" rx="5" fill="url(#cobre)" stroke="#6b3a18" stroke-width="1.5"/>

  <!-- Bornes -->
  <use xlink:href="#espiga" x="130" y="110"/>
  <use xlink:href="#espiga" x="240" y="110"/>
  <use xlink:href="#espiga" x="350" y="110"/>
  <use xlink:href="#espiga" x="130" y="240"/>
  <use xlink:href="#espiga" x="240" y="240"/>
  <use xlink:href="#espiga" x="350" y="240"/>
</svg>
