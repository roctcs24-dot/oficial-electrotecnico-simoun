  <rect x="70" y="464" width="220" height="54" rx="6" fill="#3a4044"/>
  <use xlink:href="#borne_potencia" x="110" y="490"/><use xlink:href="#borne_potencia" x="180" y="490"/><use xlink:href="#borne_potencia" x="250" y="490"/>
