  <rect x="70" y="24" width="220" height="54" rx="6" fill="#3a4044"/>
  <use xlink:href="#borne_potencia" x="110" y="50"/><use xlink:href="#borne_potencia" x="180" y="50"/><use xlink:href="#borne_potencia" x="250" y="50"/>
  <!-- Bornes de mando superiores: A1 A2 13 14 -->
  <rect x="44" y="114" width="272" height="34" rx="5" fill="#3a4044"/>
  <use xlink:href="#borne_mando" x="70" y="131"/><use xlink:href="#borne_mando" x="130" y="131"/>
  <use xlink:href="#borne_mando" x="230" y="131"/><use xlink:href="#borne_mando" x="290" y="131"/>
  <!-- Frente con la pantalla y el teclado -->
  <rect x="44" y="160" width="272" height="214" rx="8" fill="url(#frente)" stroke="#1d2124" stroke-width="2"/>
  <rect x="62" y="176" width="236" height="56" rx="4" fill="#0099a8"/>
  <rect x="70" y="244" width="220" height="70" rx="4" fill="url(#lcd)" stroke="#0b0f0e" stroke-width="2"/>
  <g fill="#3d454a" stroke="#1d2124" stroke-width="1.5">
    <rect x="76" y="326" width="40" height="30" rx="5"/><rect x="124" y="326" width="40" height="30" rx="5"/>
    <rect x="196" y="326" width="40" height="30" rx="5"/><rect x="244" y="326" width="40" height="30" rx="5"/>
  </g>
  <circle cx="180" cy="341" r="13" fill="#5a6368" stroke="#1d2124" stroke-width="1.5"/>
  <g fill="#c9d0d3"><path d="M90,341 l8,-6 v12 z M150,341 l-8,-6 v12 z"/><path d="M210,345 l6,-8 l6,8 z M258,337 l6,8 l6,-8 z"/></g>
