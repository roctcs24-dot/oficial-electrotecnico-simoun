<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="360" height="540" viewBox="0 0 360 540">
  <defs>
    <linearGradient id="caja" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9ea3a6"/><stop offset="0.12" stop-color="#d9dcdb"/><stop offset="0.7" stop-color="#c6cac9"/><stop offset="1" stop-color="#8b9093"/></linearGradient>
    <linearGradient id="frente" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a5257"/><stop offset="1" stop-color="#30363a"/></linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e2a26"/><stop offset="1" stop-color="#121a17"/></linearGradient>
    <linearGradient id="aletas" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7c8285"/><stop offset="0.5" stop-color="#b9bdbe"/><stop offset="1" stop-color="#6f7578"/></linearGradient>
    <radialGradient id="tornillo" cx="0.38" cy="0.32" r="0.8"><stop offset="0" stop-color="#f4f6f6"/><stop offset="0.55" stop-color="#b3b8ba"/><stop offset="1" stop-color="#5f6568"/></radialGradient>
    <g id="borne_potencia"><rect x="-24" y="-20" width="48" height="40" rx="4" fill="#2b2f32"/><rect x="-18" y="-14" width="36" height="28" rx="3" fill="#596064"/><circle r="10" fill="url(#tornillo)" stroke="#3b4043" stroke-width="1.5"/><path d="M-6,0 H6 M0,-6 V6" stroke="#3b4043" stroke-width="2.5"/></g>
    <g id="borne_mando"><rect x="-17" y="-15" width="34" height="30" rx="3" fill="#2b2f32"/><circle r="8" fill="url(#tornillo)" stroke="#3b4043" stroke-width="1.2"/><path d="M-5,0 H5" stroke="#3b4043" stroke-width="2.2"/></g>
  </defs>
  <!-- Disipador de aletas a los lados, carcasa gris y tapa frontal oscura -->
  <rect x="0" y="12" width="360" height="516" rx="10" fill="url(#aletas)"/>
  <g stroke="#5a6064" stroke-width="2"><path d="M8,30 V510 M16,30 V510 M344,30 V510 M352,30 V510"/></g>
  <rect x="22" y="4" width="316" height="532" rx="10" fill="url(#caja)" stroke="#5f6568" stroke-width="2"/>
