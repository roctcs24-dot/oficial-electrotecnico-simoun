  <g fill="#17293a" fill-opacity="0.75">
    <rect x="130" y="118" width="336" height="4" rx="2"/><rect x="130" y="134" width="336" height="4" rx="2"/>
    <rect x="130" y="150" width="336" height="4" rx="2"/><rect x="130" y="166" width="336" height="4" rx="2"/>
