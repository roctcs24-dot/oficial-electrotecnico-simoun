    </linearGradient>
    <linearGradient id="tapa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5f7c93"/><stop offset="0.5" stop-color="#3f5f79"/><stop offset="1" stop-color="#22394b"/>
    </linearGradient>
    <linearGradient id="cubre" x1="0" y1="0" x2="0" y2="1">
