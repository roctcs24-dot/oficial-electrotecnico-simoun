<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="360" height="500" viewBox="0 0 360 500">
  <defs>
    <linearGradient id="carril" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f9598"/>
      <stop offset="0.08" stop-color="#d9dcdd"/>
      <stop offset="0.5" stop-color="#b9bdbf"/>
      <stop offset="0.92" stop-color="#d0d3d4"/>
      <stop offset="1" stop-color="#7d8386"/>
    </linearGradient>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34383c"/>
      <stop offset="0.07" stop-color="#4d5257"/>
      <stop offset="0.5" stop-color="#565b60"/>
      <stop offset="0.93" stop-color="#4a4f54"/>
      <stop offset="1" stop-color="#2f3337"/>
    </linearGradient>
    <linearGradient id="escalonSup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62676c"/>
      <stop offset="1" stop-color="#4a4f54"/>
    </linearGradient>
    <linearGradient id="escalonInf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f54"/>
      <stop offset="1" stop-color="#3b4044"/>
    </linearGradient>
    <linearGradient id="tapa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3d41"/>
      <stop offset="0.35" stop-color="#1e2023"/>
      <stop offset="1" stop-color="#101113"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="banda" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e6e8e8"/>
      <stop offset="1" stop-color="#c3c7c9"/>
    </linearGradient>
    <radialGradient id="acero" cx="0.38" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#f4f6f6"/>
      <stop offset="0.55" stop-color="#b3b8ba"/>
      <stop offset="1" stop-color="#5f6568"/>
    </radialGradient>
    <radialGradient id="hueco" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0.55" stop-color="#050506"/>
      <stop offset="1" stop-color="#26282b"/>
    </radialGradient>

    <g id="tornillo">
      <circle r="10" fill="#0a0a0b"/>
      <circle r="9.2" fill="url(#acero)"/>
      <path d="M-5.2,0 H5.2 M0,-5.2 V5.2" stroke="#33373a" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M-3.4,-3.4 L3.4,3.4 M-3.4,3.4 L3.4,-3.4" stroke="#6a7073" stroke-width="0.9"/>
    </g>
    <g id="bornePotencia">
      <circle r="27" fill="#2b2e31"/>
      <circle r="25" fill="url(#hueco)"/>
      <rect x="-14" y="-14" width="28" height="28" rx="3" fill="#6f7578"/>
      <rect x="-14" y="-14" width="28" height="5" rx="2" fill="#a2a7a9"/>
      <use xlink:href="#tornillo" transform="scale(1.25)"/>
    </g>
    <g id="borneMando">
      <circle r="17" fill="#2b2e31"/>
      <circle r="15.4" fill="url(#hueco)"/>
      <use xlink:href="#tornillo" transform="scale(1.02)"/>
    </g>
  </defs>

  <!-- Carril DIN de 35 mm detrás del contactor -->
  <rect x="0" y="170" width="360" height="180" fill="#000000" fill-opacity="0.12"/>
  <rect x="0" y="176" width="360" height="168" fill="url(#carril)"/>
  <g fill="#6c7275">
    <rect x="10" y="244" width="30" height="32" rx="14"/>
    <rect x="320" y="244" width="30" height="32" rx="14"/>
  </g>

  <!-- Sombra -->
  <path d="M84,28 H296 L310,104 V396 L296,490 H84 L72,396 V104 Z" fill="#000000" fill-opacity="0.35"/>

  <!-- Oreja de fijación -->
  <path d="M60,410 H42 Q34,410 34,418 V452 Q34,460 42,460 H60 Z" fill="#35393d"/>
  <circle cx="47" cy="435" r="6" fill="#0d0e10"/>

  <!-- Cuerpo escalonado -->
  <path d="M76,20 H284 Q290,20 291,26 L300,100 V400 L291,474 Q290,480 284,480 H76 Q70,480 69,474 L60,400 V100 L69,26 Q70,20 76,20 Z" fill="url(#cuerpo)"/>

  <!-- Escalón superior e inferior de potencia -->
  <path d="M76,20 H284 Q290,20 291,26 L300,100 V124 H60 V100 L69,26 Q70,20 76,20 Z" fill="url(#escalonSup)"/>
  <path d="M60,376 H300 V400 L291,474 Q290,480 284,480 H76 Q70,480 69,474 L60,400 Z" fill="url(#escalonInf)"/>
  <rect x="60" y="124" width="240" height="3" fill="#191b1d"/>
  <rect x="60" y="127" width="240" height="1.5" fill="#777c80" fill-opacity="0.6"/>
  <rect x="60" y="374" width="240" height="3" fill="#191b1d"/>
  <path d="M76,21 H284" stroke="#9aa0a4" stroke-opacity="0.7" stroke-width="1.5"/>

  <!-- Barreras entre fases -->
  <g fill="#23262a">
    <rect x="142" y="26" width="6" height="94" rx="3"/>
    <rect x="212" y="26" width="6" height="94" rx="3"/>
    <rect x="142" y="380" width="6" height="94" rx="3"/>
    <rect x="212" y="380" width="6" height="94" rx="3"/>
  </g>
  <g fill="#6d7276" fill-opacity="0.55">
    <rect x="148" y="28" width="1.5" height="90"/>
    <rect x="218" y="28" width="1.5" height="90"/>
    <rect x="148" y="382" width="1.5" height="90"/>
    <rect x="218" y="382" width="1.5" height="90"/>
  </g>

  <!-- Bornes de potencia -->
  <use xlink:href="#bornePotencia" x="110" y="80"/>
  <use xlink:href="#bornePotencia" x="180" y="80"/>
  <use xlink:href="#bornePotencia" x="250" y="80"/>
  <use xlink:href="#bornePotencia" x="110" y="420"/>
  <use xlink:href="#bornePotencia" x="180" y="420"/>
  <use xlink:href="#bornePotencia" x="250" y="420"/>

  <!-- Bornes de auxiliares y bobina -->
  <use xlink:href="#borneMando" x="110" y="165"/>
  <use xlink:href="#borneMando" x="180" y="165"/>
  <use xlink:href="#borneMando" x="250" y="165"/>
  <use xlink:href="#borneMando" x="110" y="336"/>
  <use xlink:href="#borneMando" x="180" y="336"/>
  <use xlink:href="#borneMando" x="250" y="336"/>

  <!-- Tapa frontal, sobresale del cuerpo -->
  <rect x="50" y="192" width="264" height="124" rx="16" fill="#000000" fill-opacity="0.35"/>
  <rect x="50" y="188" width="260" height="124" rx="16" fill="url(#tapa)"/>
  <rect x="50" y="188" width="260" height="62" rx="16" fill="url(#brillo)"/>
  <rect x="50.75" y="188.75" width="258.5" height="122.5" rx="15.5" fill="none" stroke="#5a5e62" stroke-opacity="0.7" stroke-width="1.5"/>

  <!-- Banda de identificación -->
  <rect x="62" y="197" width="236" height="26" rx="3" fill="url(#banda)"/>

  <!-- Nervios de la tapa -->
  <g fill="#000000" fill-opacity="0.45">
    <rect x="70" y="232" width="6" height="42" rx="3"/>
    <rect x="86" y="232" width="6" height="42" rx="3"/>
    <rect x="102" y="232" width="6" height="42" rx="3"/>
    <rect x="252" y="232" width="6" height="42" rx="3"/>
    <rect x="268" y="232" width="6" height="42" rx="3"/>
    <rect x="284" y="232" width="6" height="42" rx="3"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.08">
    <rect x="76" y="232" width="1.5" height="42"/>
    <rect x="92" y="232" width="1.5" height="42"/>
    <rect x="108" y="232" width="1.5" height="42"/>
    <rect x="258" y="232" width="1.5" height="42"/>
    <rect x="274" y="232" width="1.5" height="42"/>
    <rect x="290" y="232" width="1.5" height="42"/>
  </g>

  <!-- Ventana del indicador de posición -->
  <rect x="148" y="226" width="64" height="52" rx="6" fill="#050506"/>
  <rect x="148.75" y="226.75" width="62.5" height="50.5" rx="5.5" fill="none" stroke="#54585c" stroke-width="1.5"/>
</svg>
