<svg xmlns="http://www.w3.org/2000/svg" width="480" height="280" viewBox="0 0 480 280">
  <defs>
    <linearGradient id="virola" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9aa1a5"/><stop offset="0.45" stop-color="#d0d4d6"/><stop offset="1" stop-color="#5f6568"/>
    </linearGradient>
    <linearGradient id="caja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a6b8a"/><stop offset="1" stop-color="#1f3e52"/>
    </linearGradient>
  </defs>
  <!-- Soportes -->
  <path d="M110,200 L96,250 H150 L136,200 Z M340,200 L326,250 H380 L366,200 Z" fill="#2a2e31"/>
  <!-- Virola -->
  <rect x="70" y="100" width="340" height="110" rx="12" fill="url(#virola)"/>
  <!-- Cajas de agua en los extremos -->
  <rect x="30" y="92" width="46" height="126" rx="10" fill="url(#caja)"/>
  <rect x="404" y="92" width="46" height="126" rx="10" fill="url(#caja)"/>
  <g fill="#c8a248"><circle cx="40" cy="104" r="4"/><circle cx="40" cy="206" r="4"/><circle cx="440" cy="104" r="4"/><circle cx="440" cy="206" r="4"/></g>
  <!-- Agua de mar: entra abajo, sale arriba -->
  <path d="M8,190 H30" stroke="#3fb5a3" stroke-width="14"/>
  <path d="M30,120 H8" stroke="#3fb5a3" stroke-width="14"/>
  <!-- Entrada de vapor y salida de líquido -->
  <path d="M190,100 V44" stroke="#d9534f" stroke-width="16"/>
  <path d="M290,210 V262" stroke="#e0a030" stroke-width="12"/>
  <!-- Válvula de seguridad y purga -->
  <rect x="320" y="70" width="18" height="30" fill="#c8312a"/>
  <path d="M329,70 V40 H352" fill="none" stroke="#8e9496" stroke-width="6"/>
  <rect x="246" y="82" width="10" height="18" fill="#5f6568"/>
  <!-- Placa -->
  <rect x="120" y="140" width="110" height="40" rx="3" fill="#e9ebe8"/>
</svg>
