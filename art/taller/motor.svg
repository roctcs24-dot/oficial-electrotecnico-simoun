  <!-- Carcasa del motor con sus aletas de refrigeración -->
  <rect x="2" y="2" width="476" height="316" rx="12" fill="url(#carcasa)"/>
  <g stroke="#0f1b24" stroke-opacity="0.55" stroke-width="2">
