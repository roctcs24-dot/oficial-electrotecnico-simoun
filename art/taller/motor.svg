<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="480" height="320" viewBox="0 0 480 320">
  <defs>
    <linearGradient id="carcasa" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a7c97"/><stop offset="0.3" stop-color="#46667f"/><stop offset="0.75" stop-color="#2c4558"/><stop offset="1" stop-color="#1d2f3d"/></linearGradient>
    <linearGradient id="caja" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6a8ca6"/><stop offset="0.45" stop-color="#46667f"/><stop offset="1" stop-color="#253b4c"/></linearGradient>
    <linearGradient id="fondo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#15191c"/><stop offset="0.12" stop-color="#262b2f"/><stop offset="1" stop-color="#2f3438"/></linearGradient>
    <linearGradient id="regleta" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5a4535"/><stop offset="0.5" stop-color="#3e2f25"/><stop offset="1" stop-color="#2a1f19"/></linearGradient>
    <linearGradient id="nervio" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2a1f19"/><stop offset="0.5" stop-color="#6a5240"/><stop offset="1" stop-color="#2a1f19"/></linearGradient>
    <radialGradient id="bronce" cx="0.38" cy="0.32" r="0.75"><stop offset="0" stop-color="#fbe6a2"/><stop offset="0.5" stop-color="#c9973f"/><stop offset="1" stop-color="#6f4e1a"/></radialGradient>
    <radialGradient id="acero" cx="0.38" cy="0.32" r="0.8"><stop offset="0" stop-color="#f4f6f6"/><stop offset="0.55" stop-color="#b3b8ba"/><stop offset="1" stop-color="#5f6568"/></radialGradient>
    <g id="espiga"><circle r="23" fill="#000" opacity="0.35" cx="2" cy="3"/><path d="M-17,-10 L0,-20 L17,-10 V10 L0,20 L-17,10 Z" fill="url(#bronce)" stroke="#4a3210" stroke-width="1.5"/><circle r="8" fill="#e8c878" stroke="#6f4e1a" stroke-width="1.5"/><circle r="3" fill="#8a6a2a"/></g>
    <g id="taladro"><circle r="6" fill="#16222b"/><circle r="4" fill="url(#acero)"/></g>
